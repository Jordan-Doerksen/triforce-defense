    <desc id="c101-desc">Top, the art: a day and a night, half and half and not to time. By day the field force marches out of the gate on a ritual obelisk on blight, an engine shelling it and footmen on its acolytes, while peasants raise a plot behind the wall; by night the captain, the field force and the garrison hold the gate as ghouls and skeletons with glowing eyes come down the road and fall. Bottom, the detail, to scale: the thirteen-night match; event nights 3, 6 and 9 drawn from a pool of four (the evil fog, the air raid, the insurgents, the burrow) without repeats, each led by its hero, night 12 any event at full strength; a diamond on every second night for a new unit; night 13 the boss, chosen at the fire, and three lieutenants with no dawn of its own, ending one of three ways (the captains kill the boss, the King’s army arrives, or the rituals were broken); a bounty every dawn; a row of each cycle's lengths, days shrinking from three minutes to one and a half as nights grow from one and a half to three, even by night 7; the undead's day and night strength; minutes; and the total, 58 and a half minutes, against v1's label of about 40, marked in red; and below, the long night, 26 nights with an event every third, later.</desc>
