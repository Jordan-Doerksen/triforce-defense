    <desc id="c102-desc">The art, top left: the horde on a road through the thirteen nights, a switchback across a blighted land at night, a milestone for every night, the event nights flagged. More of it comes every night: ghouls and skeletons, then a new unit every second night, necromancers from night 2 and shades from night 4 as one roll of many has it, the night's aura glowing stronger beneath it, and at the road's end, at the gate, night 13's boss. Top right, every night more and stronger: a diamond on every second night for a new unit, a bar a night for the count, and a ring a night in two rows, normal and hard, for the night's aura, no unit edited, one hidden caster per gate set at dusk; and the roll as the captains see it at the fire, the clock's thirteen nights with the new units above nights 2 and 4 and open diamonds above the add nights still to come. Below, the table rolled at the fire, a tree: from the fire to night 2's pair, spitters or necromancers, to night 4's pair, necromancers or shades; where night 2 brought necromancers they are struck from night 4's pair and shades come; nights 6 to 12 to come. Beside it the tiers, a staircase, a step a tier, none before its night: ghouls and skeletons from night 1, spitters and necromancers from night 2, shades from night 4, abominations on a last step, not before night 4, their night open. And the shade: weak, it blinks over the wall into the town, where a tower inside shoots it and a footman takes it.</desc>
