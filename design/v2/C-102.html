    <desc id="c102-desc">The art, top left: the horde on a road through the thirteen nights, a switchback across a blighted land at night, a milestone for every night, the event nights flagged. More of it comes every night: ghouls and skeletons, then a new unit every second night as one roll of many has it, necromancers on night 2, shades on 4, ghosts on 6, abominations on 8, frost revenants on 10, lightning revenants on 12, the night's aura glowing stronger beneath it, and at the road's end, at the gate, night 13's boss as a crowned shadow, the one chosen at the fire. Top right, every night more and stronger: a diamond on every second night for a new unit, a bar a night for the count, a ring a night in two rows, normal and hard, for the night's aura; and the roll as the captains see it at the fire, the clock's thirteen nights with each new unit over its night. Below, the table rolled at the fire: a column for night 1's ghouls and skeletons, then a pair for each add night, each unit a card with its level, its hit points, what it does and its tier: spitters or necromancers on 2; necromancers or shades on 4; webspinners or ghosts on 6; abominations or frost revenants on 8, and the other on 10; lightning revenants or skeletal orc grunts on 12; dashed links where a unit already in is struck and the other comes. Beside it, WC3's tiers as a staircase of three buildings: the Necropolis from night 1 (ghouls, skeletons, spitters), the Halls of the Dead from night 2 (necromancers, shades, webspinners, ghosts), the Black Citadel from night 8 (abominations, frost revenants, skeletal orc grunts, lightning revenants), and above it hard's frost wyrm.</desc>
