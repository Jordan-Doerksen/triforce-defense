    <desc id="c201-desc">The art, top left: one draw of the event nights, played as a board of twelve scenes, the four event nights in rows and the three towns, the hill, the valley and the forest, in columns. Night 3, the evil fog, in every town, its hero the Death Knight at the hill's gate; night 6, the insurgents, cultists at every graveyard, the Lich among the forest's; night 9, the burrow, a mound in every town, the Crypt Lord out of the valley's; night 12, the air raid at full strength, Gargoyles over every wall, the Dreadlord at the hill. The hero's town is framed in gold, the drop beside him; running, a red frame walks the four. Top right, the draw: the pool of four events and their heroes; nights 3, 6 and 9 each draw one, no repeats, so each match misses one; night 12 draws any at full strength; the hero's level on each. Below it, the heroes night by night: on normal only the event nights, each led by its hero; on hard a hero every night, the four in turn between the events, each with its level. Below, the four events and their heroes as cards: the fog and the Death Knight, the insurgents and the Lich, the air raid and the Dreadlord, the burrow and the Crypt Lord; each with its scene, what the event does and its answer, the hero's kit (passive, active, ultimate, stats), the item it drops, and the boss it heralds or its place on night 13.</desc>
