    <title id="m101-title">Sheet M-101, the province: three towns, and the one next door already fallen. Approved.</title>
    <desc id="m101-desc">The art, top left: the province as a diorama at dusk. The mountain ridge runs down the west, snow on its peaks, with spurs around the hill; a stream leaves a spring high in the ridge, falls down its face onto the hill's plateau, runs through the hill town, drops over the falls at the plateau's east cliff, and winds past the bridge into the lake inside the valley town. The thick forest runs down the east around the forest town, with thin woods along the road from the valley. Across the north the overrun province lies blighted, three rituals glowing on it, and the first wave of ghouls and skeletons comes down a short road onto each town's gate, where the garrison waits. Top right, the graph: the three towns as rings with their gates to the north, the safe road from the hill down beside the falls and over the bridge to the valley, the thin woods on to the forest, short roads up into the wild from every gate with the waves coming down them, and no road between the hill and the forest but through the wild. Two tokens race from the hill to the forest, one by the safe road and one through the wild. Below, the detail: the plan in ink, its relief drawn as hachures that run downhill, heavier where the ground is steeper, the river widening downstream, the roads, the towns with their walls, gates and halls, the rituals and the wave arrows, and the cut line of section A–A; the section, jogged through all three towns, from the ridge across the hill and down the falls, through the valley's lake, up to the forest; and the two roads from the hill to the forest unrolled to scale, with a runner on each.</desc>
