    <desc id="s101-desc">The art, top left: the screen before the first day, a love letter to Diablo II's character screen. The dark, a ruined watchtower behind, a dead tree with crows, a hound asleep, the three towns' standards, and the fire with its embers rising. In its light stand the hill's Bombardier, marked you, and the forest's Prelate; the valley's charge is still open, its Marshal a shadow behind the fire. The Lua frames float at the edges: the banner, two of three stand at the fire; the roll, shown, the table's six new units, the boss and his herald, and on hard the heroes' order; the host's panel, length thirteen nights, difficulty hard, the boss Mal'Ganis; and the three charges, the valley's button lit, take this charge. Top right, the host's panel setting by setting: length, thirteen nights or the long night later; difficulty, normal or hard; the boss, Mal'Ganis, Arthas, Kel'Thuzad or rolled; only the host changes them, every player sees each change, synced before the first day. Below it, the three charges: the hill, Siege Engine, break, armour lean, the Bombardier; the valley, Knight, move, speed lean, the Marshal; the forest, Templar, hold, damage lean, the Prelate. Below, the fire in four numbered steps, each a small screen with its frame lit: take a charge; the host sets the match; the roll, shown; three Readys, and the first day begins. No clocks.</desc>
