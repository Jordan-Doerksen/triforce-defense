    <desc id="t101-desc">The art, top left: the finished hill town at the Castle tier, an isometric render on its high ground, with the mountains behind it on the west and south, snow on their peaks; the river comes down out of them in a cascade, runs through the town and drops over the falls off the east cliff. The walls and gate with the garrison, the Castle, the barracks, farm, blacksmith, lumber mill and gold mine, and six plots built as one build of many. Top right, a key plan of the province: the hill picked out, the ridge on the west and its spurs around the town, contours falling away east and south, the river from its spring in the ridge, through the town, over the falls, past the bridge and into the valley's lake, with arrows downstream. Below it, a section of the river from source to lake: the ground falls the whole way, the ridge, the hill's plateau with the castle between its walls, the drop at the falls, the bridge, the lake. Then the hill's charge: the siege engine, its special unit, and Win B, which runs through this town. Below, the detail: the town in three numbered steps, one per hall tier, each a plan in ink: 1, the Town Hall, opening ring I and forge tiers one and two; 2, the Keep, opening ring II and tiers three and four; 3, the Castle, opening ring III, the siege engine and the hero's ultimate.</desc>
