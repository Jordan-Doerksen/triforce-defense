    <desc id="t201-desc">The art, top left: the gate at night, the first blow. The gatehouse with its portcullis and braziers stands in the curtain wall, the two scout towers behind it shooting over the wall; the wave of ghouls and skeletons closes on the gate along the road from both sides, the front rank striking the door, while three peasants of the repair crew hammer at the gate's foot and two of the garrison hold before it. Top right, the gate's card: its tier and hit points as v1's screen shows them, bracketed, and three upgrades as research, reinforce, armour and the crew's size; and one gate in three towns, the same structure in the hill, the valley and the forest, with the phrases the players say for its states, gate tier 2 one tower, gate tier 2 towers up, gate tier 3 towers up. Below, the gate in plan in the hill town: the walls, the gate, the two scout-tower plots behind the wall, the river and the bridge, the hall and the barracks, the crew's run from the barracks over the bridge to the gate, the garrison rallied behind it, the wave coming from the north. And who does what at the gate: the garrison holds it, not yours, the barracks feeds it; the crew mends it and goes home, not yours, no clicks and no bill; the scout towers shoot over the wall from their plots; and you, the one choice, stay or go. The chores on one side, the interesting part on the other.</desc>
