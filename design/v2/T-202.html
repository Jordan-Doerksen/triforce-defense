    <desc id="t202-desc">The art, across the top: three nights at the gate as a storyboard, three frames each from dusk to dawn, with the gate's hit-point bar under every frame. A normal wave: the wave hits, the crew mends, dawn and it is held. A spike: more than the gate holds, the field force comes home, dawn and it is held with help. A boss: the boss at the door, the gate breaks, the breach and the horde inside, to the hall. Running, a red frame plays the board frame by frame. Below, what's at your gate tonight, a tree from dusk: a normal wave, the garrison holds and the crew mends, so stay out, raid or help a friend; a spike, more than the garrison holds, so call the field force home; a boss, the gate will break, so everyone home and the hall is the last stand; an event night, fog, the air raid or the insurgents, which has its own answer. Beside each, who answers it.</desc>
