    <desc id="t301-desc">The art, top left: one ground, seven futures. An empty plot ring stands in the middle of a grass ground, two peasants waiting by it, with paths out to eight places round it like the spokes of a wheel: on seven of them stand the seven things a plot can become, the Farm with its pumpkin field, the Guard Tower, the Arcane Tower, the Arcane Sanctum, the Workshop, the Market and the Aviary with its gryphon circling; the eighth place is empty. Running, the middle ground becomes each of the seven in turn. Top right, the plot's card: seven buttons with their hotkeys and role marks, the eighth slot empty; and what each answers, a grid of the seven against what their tooltips say they give, with the check that no option covers another, so none is strictly best. Below, the questions a plot asks, as a tree: from what the night told you, through the spend, hold, move or pay, to the building that answers it: weak ranged, the Guard Tower; casters or the air raid, the Arcane Tower; gargoyles over the wall, the Aviary; casters of your own, the Arcane Sanctum; siege, the Workshop; more army, the Farm; potions and gear, the Market. Then the plot building itself in view in three steps: choose on the card, the scaffold with peasants at work under a build timer, and the Arcane Sanctum standing.</desc>
