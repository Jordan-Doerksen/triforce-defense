    <desc id="t401-desc">The art, top left: a street by day. On the left the smithy, an open front glowing with the forge, its chimney smoking, the smith hammering at the anvil in a shower of sparks, swords on the rack; a footman walks out with the new blade. Across the street the market's three stalls under striped awnings, potions, scrolls, boots and rings on their boards, a hero on horseback among them. Top right, the forge's window: weapons and armour, six tiers each, three researched in weapons and two in armour, the fifth and sixth locked until the Castle, the tiers bracketed by the hall that opens them, the blade marked at the third and the plate at the fifth; and the tooltip for weapons four. Then the market's shelf: at the Town Hall a potion, a town portal scroll for home only, a boot and a ring; at the Keep the next step of each; at the Castle one rare per market, rolled at the war council; the good items only from the wild. Below, the ladder on the footman himself: six footmen, tier one to six, the blade changing at three and the plate at five, under the Town Hall, the Keep and the Castle.</desc>
