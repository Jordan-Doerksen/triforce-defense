    <desc id="w102-desc">The art, top left: night 13, looking south from the wild over three roads to the three towns on the horizon, the hill under the western ridge, the valley by its lake, the forest in its wood. The boss chosen at the fire, here Mal'Ganis, huge, takes the middle road to the valley with the horde, the Spider Lord, the burrow's Crypt Lord, ahead of him; the Rotting Brute takes the hill's road; the east ritual lies broken, its obelisk felled, so the forest's road is empty. The west and middle rituals still channel in the wild. Top right, the boss, chosen at the fire, by the host or rolled: Mal'Ganis on the Dreadlord model, Arthas fallen on the Death Knight's, Kel'Thuzad on the Lich's, each larger, each with his herald, the event hero who leads his event all match; if Kel'Thuzad, the forest's lieutenant is his apprentice. Below it, the rituals and their lieutenants: the west ritual's Rotting Brute for the hill, the middle's Spider Lord for the valley, the east's Lich for the forest, here broken, so the Lich stays home; the boss always takes the middle road to the valley. Below, the endings and their last screens: the captains kill the boss; the King's army arrives three minutes into night 13; the three rituals broken any day before; and, framed in red, all three halls fall. Under each, its last screen back at the fire where it began: by day for a victory, the boss's crown in the ash, the King's banners, the obelisks down; cold for the loss.</desc>
