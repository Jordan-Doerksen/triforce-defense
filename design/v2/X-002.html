    <desc id="x002-desc">Top, the art: one day-and-night cycle painted to scale, two minutes forty of day on the left and one minute twenty of night on the right (test values). By day a captain's field force and a siege engine march for a ritual obelisk on blight while peasants raise a plot behind the wall; by night ghouls and skeletons with glowing eyes come down the road to the gate and the garrison holds. Bottom, the detail: the thirteen-night match to scale, event nights 3, 6, 9 drawn from the pool without repeats, night 12 any event at full strength, night 13 the boss and three lieutenants, a bounty every dawn, the relief at the end. Thirteen four-minute cycles make a 52-minute match; the red note marks that v1’s label of about 40 minutes would need a three-minute cycle.</desc>
