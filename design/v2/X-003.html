    <desc id="x003-desc">Top left, the art: a box, the finished hill town at the Castle tier as an isometric diorama on its high ground, the river running through it and falling off the east cliff, the walls and the gate with the garrison, the Castle, the spine of barracks, farm, blacksmith, lumber mill and gold mine, and six plots built as one build of many: an Arcane Sanctum, a Workshop, a Farm, a Market, a Guard Tower and an Aviary with a gryphon circling. Badges: six plots, seven choices. Then the detail, three steps in ink: step 1, the Town Hall, with the spine, the gate, two tower plots and ring I's two plots, all new; step 2, the Keep, opening ring II; step 3, the Castle, opening ring III and the hill's siege engine. Each step has a big number, a parts box with counts, bold new parts and arrows. A callout, done six times, shows a plot, its card of seven choices with the eighth slot empty, and the plot building itself in view.</desc>
